name: Release

# A tag `v<version>` builds `cargo-sdk` and `sdk-rustc` for six platforms and attaches them to the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, platform: linux-x86_64,   ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   platform: windows-x86_64, ext: .exe }
          - { os: windows-latest, target: i686-pc-windows-msvc,     platform: windows-i686,   ext: .exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,  platform: windows-arm64,  ext: .exe }
          - { os: macos-latest,   target: x86_64-apple-darwin,      platform: macos-x86_64,   ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,     platform: macos-arm64,    ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release
          tar -czf "dist/cargo-sdk-${{ matrix.platform }}.tar.gz" -C "$bin" "cargo-sdk${{ matrix.ext }}" "sdk-rustc${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
